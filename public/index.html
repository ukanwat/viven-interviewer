<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Interviewer</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- Start -->
  <main id="start" class="view">
    <div class="start-card">
      <h1>Hi. What's your name?</h1>
      <input id="name" autocomplete="given-name" placeholder="Your name" aria-label="Your name" />
      <div id="returning" class="returning hidden"></div>
      <div id="lab" class="lab hidden">
        <label>Topic hint <span class="muted">(lab only)</span><input id="topic" /></label>
        <label>Sealed facts <span class="muted">(lab only, one per line; never shown to the interviewer)</span><textarea id="golden" rows="3"></textarea></label>
      </div>
      <button id="call" class="call-btn" type="button"><span class="dot"></span><span id="callLabel">Call</span></button>
      <label class="toggle"><input type="checkbox" id="typeMode" /> Type instead</label>
      <p id="startErr" class="err hidden"></p>
    </div>
  </main>

  <!-- In call -->
  <main id="callView" class="view hidden">
    <header class="bar">
      <div class="who"><span id="liveDot" class="live-dot"></span><b id="callName"></b> <span id="callMode" class="muted"></span> <span id="timer" class="muted"></span></div>
      <div class="bar-actions">
        <button id="mute" class="ghost hidden" type="button" title="Turn your microphone off">Mute mic</button>
        <button id="quiet" class="ghost hidden" type="button" title="Stop hearing it; read the conversation instead">Read only</button>
        <button id="hangup" class="danger" type="button">End call</button>
      </div>
    </header>
    <div class="cols">
      <section class="col transcript-col">
        <h2>Conversation</h2>
        <div id="transcript" class="transcript"></div>
        <div id="thinking" class="thinking hidden">thinking…</div>
        <form id="typeForm" class="type-form">
          <input id="typeInput" placeholder="Type your answer… (or say 'call me later')" autocomplete="off" />
          <button type="submit">Send</button>
        </form>
      </section>
      <section class="col learned-col">
        <h2>What I've learned about you</h2>
        <div id="expertise" class="expertise muted"></div>
        <div id="learned"></div>
        <h3>Threads</h3>
        <div id="threads" class="threads"></div>
        <details class="why-panel" open>
          <summary>Why I asked that</summary>
          <div id="why" class="why muted small"></div>
        </details>
      </section>
    </div>
  </main>

  <!-- After -->
  <main id="after" class="view hidden">
    <div class="after-wrap">
      <h1 id="afterTitle">Thanks</h1>
      <p id="afterSummary" class="sub"></p>
      <div id="report" class="report"><p class="muted">Writing the report…</p></div>
      <div class="after-actions">
        <button id="again" type="button">Continue the conversation</button>
        <a href="/" class="ghost-link">New person</a>
      </div>
    </div>
  </main>

  <audio id="remote" autoplay></audio>
  <script type="module" src="/app.js"></script>
</body>
</html>
