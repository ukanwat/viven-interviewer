<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>People</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="page">
    <h1 class="display">People</h1>
    <div class="page-grid">
      <nav id="list" class="people-list"><p class="muted">Loading…</p></nav>
      <section id="detail" class="hidden">
        <h1 id="dName" class="display person-name"></h1>
        <p id="dWho" class="lede"></p>
        <div class="tabs"><button data-tab="notes" class="on">Notebook</button><button data-tab="talk">Conversations</button></div>
        <div id="dNotes" class="nb"></div>
        <div id="dTurns" class="transcript hidden"></div>
      </section>
    </div>
  </main>
  <script type="module">
    import { api, esc, renderNotebook, notesCount, when } from '/ui.js';
    const $ = (id) => document.getElementById(id);
    const { people } = await api('/api/people');
    $('list').innerHTML = people.length
      ? people.map((p) => `<button class="person-row" data-id="${esc(p.id)}"><b>${esc(p.name)}</b><span>${when(p.updatedAt)} · ${p.sessions} conversation${p.sessions === 1 ? '' : 's'} · ${p.items} notes</span></button>`).join('')
      : '<p class="muted">No one yet.</p>';
    $('list').addEventListener('click', (e) => {
      const b = e.target.closest('.person-row');
      if (b) open(b.dataset.id);
    });
    document.querySelector('.tabs').addEventListener('click', (e) => {
      const t = e.target.closest('button');
      if (!t) return;
      document.querySelectorAll('.tabs button').forEach((x) => x.classList.toggle('on', x === t));
      $('dNotes').classList.toggle('hidden', t.dataset.tab !== 'notes');
      $('dTurns').classList.toggle('hidden', t.dataset.tab !== 'talk');
    });
    async function open(id) {
      document.querySelectorAll('.person-row').forEach((x) => x.classList.toggle('on', x.dataset.id === id));
      const p = await api(`/api/person/${encodeURIComponent(id)}`);
      $('detail').classList.remove('hidden');
      $('dName').textContent = p.name;
      $('dWho').textContent = p.expertise || p.summary || '';
      renderNotebook($('dNotes'), p);
      let last = '';
      $('dTurns').innerHTML = p.turns
        .map((t) => {
          const head = t.sessionId !== last ? `<div class="session-head">${when(t.at)} · ${t.channel === 'voice' ? 'voice' : 'typed'}</div>` : '';
          last = t.sessionId;
          return `${head}<div class="line ${t.role}"><span class="speaker">${t.role === 'agent' ? 'Interviewer' : esc(p.name)}</span><span class="text">${esc(t.text)}</span></div>`;
        })
        .join('');
      history.replaceState(null, '', `#${encodeURIComponent(id)}`);
    }
    if (location.hash) open(decodeURIComponent(location.hash.slice(1)));
    else if (people[0]) open(people[0].id);
  </script>
</body>
</html>
