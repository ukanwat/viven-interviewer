# Harness self-tests and typecheck on every push. No model calls, no secrets.
name: eval-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 25 }
      - run: npm install
      - run: npx tsc --noEmit -p .
      - run: npm run test:eval
